[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (exit 0) when nothing that affects the published site changed
  # since the last deploy. Each production deploy costs 15 credits. See CLAUDE.md.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude).claude' ':(exclude).github' ':(exclude)emails' ':(exclude)scripts/email' ':(exclude)README.md' ':(exclude)CLAUDE.md'"
