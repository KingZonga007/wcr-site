name: Send due emails

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# One run at a time; a slow send finishes before the next run starts.
concurrency:
  group: email-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
      TEST_RECIPIENTS: ${{ secrets.TEST_RECIPIENTS }}
      SITE_URL: https://westcoastrevival.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Send due campaigns (one-off and release emails)
        run: node scripts/email/send-due.mjs
      - name: Send automatic emails (WIW episodes, weekly digest, new videos)
        if: ${{ !cancelled() }}
        run: node scripts/email/send-triggered.mjs
